<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>被留下的人 · 第一章 零号大坝</title>
<style>
  :root{
    --ink:#ece5d8; --dim:#9c9488; --amber:#d8a35a; --amber-dim:#8a6a3d;
    --red:#b23a32; --teal:#4d6f6c; --panel:rgba(10,12,12,.78);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:#050606;overflow:hidden;
    font-family:"Source Han Serif SC","Noto Serif SC","Songti SC","STSong","SimSun",serif;
    color:var(--ink);}
  #stage{position:fixed;inset:0;overflow:hidden;}
  #shot{position:absolute;inset:-2%;width:104%;height:104%;object-fit:cover;
    filter:brightness(.7) saturate(.92) contrast(1.06) blur(.2px);
    transform:scale(1.02); transition:opacity .55s ease;}
  #shot.kb{animation:kb 24s ease-in-out infinite alternate;}
  @keyframes kb{from{transform:scale(1.02) translate(0,0);}to{transform:scale(1.09) translate(-1.2%,-1%);}}
  #shade{position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(120% 90% at 50% 35%, rgba(0,0,0,0) 35%, rgba(0,0,0,.55) 100%),
      linear-gradient(0deg, rgba(3,4,4,.98) 0%, rgba(3,4,4,.72) 18%, rgba(3,4,4,0) 46%),
      linear-gradient(180deg, rgba(3,4,4,.86) 0%, rgba(3,4,4,0) 22%);}
  #grain{position:absolute;inset:0;pointer-events:none;opacity:.055;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='.9'/></svg>");}
  #hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;
    align-items:center;padding:22px 30px;font-family:"Microsoft YaHei","PingFang SC",sans-serif;
    font-size:12px;letter-spacing:.22em;color:rgba(236,229,216,.55);z-index:30;pointer-events:none;}
  #hud .right{pointer-events:auto;display:flex;gap:18px;}
  #hud button{background:none;border:0;color:rgba(236,229,216,.55);font:inherit;letter-spacing:.18em;
    cursor:pointer;padding:4px 2px;border-bottom:1px solid transparent;}
  #hud button:hover{color:var(--amber);border-bottom-color:var(--amber-dim);}

  #subwrap{position:absolute;left:0;right:0;bottom:0;padding:0 6vw 6.2vh;z-index:20;
    display:flex;justify-content:center;pointer-events:none;}
  #subtitle{width:min(1060px,100%);padding:6px 2px 0;opacity:0;transform:translateY(10px);
    transition:opacity .35s ease,transform .35s ease;}
  #subtitle.on{opacity:1;transform:none;}
  #name{font-family:"Microsoft YaHei","PingFang SC",sans-serif;font-size:13px;letter-spacing:.26em;
    color:var(--amber);margin-bottom:9px;min-height:16px;display:flex;align-items:center;gap:10px;}
  #name::after{content:"";display:block;height:1px;width:38px;background:var(--amber-dim);opacity:.8;}
  #name.narr{color:rgba(236,229,216,.45);}
  #name.narr::after{background:rgba(236,229,216,.2);}
  #text{font-size:clamp(17px,1.55vw,23px);line-height:1.82;letter-spacing:.02em;
    color:#f2ecdf;text-shadow:0 2px 18px rgba(0,0,0,.9),0 0 2px rgba(0,0,0,.8);}
  #hint{position:absolute;right:6vw;bottom:2.2vh;font-family:"Microsoft YaHei",sans-serif;
    font-size:11px;letter-spacing:.22em;color:rgba(236,229,216,.32);z-index:21;opacity:0;transition:opacity .3s;}
  #hint.on{opacity:1;}

  #choices{position:absolute;left:0;right:0;bottom:0;top:0;z-index:40;display:none;
    align-items:center;justify-content:center;flex-direction:column;gap:13px;
    background:linear-gradient(0deg,rgba(3,4,4,.96) 0%,rgba(3,4,4,.55) 55%,rgba(3,4,4,.3) 100%);
    padding:8vh 5vw;}
  #choices.on{display:flex;}
  #prompt{font-family:"Microsoft YaHei",sans-serif;font-size:12px;letter-spacing:.3em;
    color:var(--amber);margin-bottom:12px;text-align:center;}
  .opt{width:min(860px,100%);display:flex;gap:16px;align-items:flex-start;text-align:left;
    background:var(--panel);border:1px solid rgba(236,229,216,.14);border-left:2px solid rgba(216,163,90,.35);
    color:var(--ink);padding:16px 20px;font-family:"Microsoft YaHei","PingFang SC",sans-serif;
    font-size:clamp(14px,1.12vw,16px);line-height:1.6;cursor:pointer;backdrop-filter:blur(8px);
    transition:border-color .18s,background .18s,transform .18s;}
  .opt:hover{border-color:rgba(216,163,90,.75);border-left-color:var(--amber);
    background:rgba(26,24,20,.86);transform:translateX(3px);}
  .opt .k{flex:none;font-family:Georgia,serif;font-size:13px;color:var(--amber);letter-spacing:.1em;
    border:1px solid rgba(216,163,90,.4);width:22px;height:22px;display:flex;align-items:center;
    justify-content:center;margin-top:1px;}
  .opt:hover .k{background:var(--amber);color:#141210;}

  .card{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
    flex-direction:column;text-align:center;padding:6vh 7vw;}
  .card.on{display:flex;animation:fadein .5s ease;}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  #death{background:radial-gradient(90% 80% at 50% 42%,rgba(96,16,12,.42) 0%,rgba(4,4,4,.97) 62%);}
  #death .tag{font-family:"Microsoft YaHei",sans-serif;font-size:12px;letter-spacing:.55em;
    color:var(--red);margin-bottom:18px;}
  #death .title{font-size:clamp(38px,4.6vw,66px);letter-spacing:.14em;color:#e9dccb;
    text-shadow:0 0 44px rgba(178,58,50,.5);margin:0 0 22px;}
  #death .rule{width:54px;height:1px;background:rgba(178,58,50,.7);margin:0 0 24px;}
  #death .sum{max-width:640px;font-size:clamp(14px,1.15vw,17px);line-height:1.9;
    color:rgba(236,229,216,.72);margin-bottom:10px;}
  #death .note{max-width:640px;font-family:"Microsoft YaHei",sans-serif;font-size:12px;
    line-height:1.8;color:rgba(236,229,216,.38);margin:14px 0 34px;letter-spacing:.04em;}
  .btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;}
  .btn{font-family:"Microsoft YaHei",sans-serif;font-size:13px;letter-spacing:.16em;
    padding:12px 26px;background:transparent;color:var(--ink);cursor:pointer;
    border:1px solid rgba(236,229,216,.28);transition:all .18s;}
  .btn:hover{border-color:var(--amber);color:var(--amber);background:rgba(216,163,90,.07);}
  .btn.primary{border-color:rgba(216,163,90,.6);color:var(--amber);}
  .btn.primary:hover{background:var(--amber);color:#141210;}

  #endlay{background:radial-gradient(90% 80% at 50% 40%,rgba(38,62,58,.5) 0%,rgba(4,4,4,.97) 65%);}
  #endlay .tag{font-family:"Microsoft YaHei",sans-serif;font-size:12px;letter-spacing:.55em;
    color:var(--amber);margin-bottom:16px;}
  #endlay .title{font-size:clamp(34px,4vw,58px);letter-spacing:.2em;margin:0 0 8px;}
  #endlay .sub{font-family:"Microsoft YaHei",sans-serif;font-size:13px;letter-spacing:.28em;
    color:var(--dim);margin-bottom:34px;}
  #endlay .body{max-width:640px;font-size:clamp(14px,1.15vw,17px);line-height:2.1;
    color:rgba(236,229,216,.8);margin-bottom:28px;}
  #endlay .stats{font-family:"Microsoft YaHei",sans-serif;font-size:12px;letter-spacing:.12em;
    color:rgba(236,229,216,.45);margin-bottom:34px;line-height:2;}
  #endlay .stats b{color:var(--amber);font-weight:400;}

  #title{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;
    flex-direction:column;background:
      radial-gradient(80% 70% at 50% 45%,rgba(0,0,0,.35),rgba(3,4,4,.92) 70%),
      url("assets/dam.jpg") center/cover no-repeat;}
  #title .small{font-family:"Microsoft YaHei",sans-serif;font-size:12px;letter-spacing:.5em;
    color:rgba(216,163,90,.85);margin-bottom:26px;}
  #title h1{font-size:clamp(46px,6.4vw,92px);letter-spacing:.16em;margin:0;font-weight:400;
    text-shadow:0 6px 60px rgba(0,0,0,.9);}
  #title .line{width:1px;height:52px;background:linear-gradient(180deg,var(--amber-dim),transparent);
    margin:26px 0;}
  #title .cap{font-family:"Microsoft YaHei",sans-serif;font-size:13px;letter-spacing:.3em;
    color:rgba(236,229,216,.6);margin-bottom:44px;}
  #title .btns{flex-direction:column;gap:12px;width:min(320px,80vw);}
  #title .btn{width:100%;padding:14px;letter-spacing:.24em;}
  #title .foot{position:absolute;bottom:26px;font-family:"Microsoft YaHei",sans-serif;
    font-size:10px;letter-spacing:.22em;color:rgba(236,229,216,.3);}

  #menu{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;
    background:rgba(3,4,4,.86);backdrop-filter:blur(6px);}
  #menu.on{display:flex;}
  #menu .box{width:min(360px,84vw);border:1px solid rgba(236,229,216,.14);padding:30px 26px;
    background:rgba(12,13,13,.92);display:flex;flex-direction:column;gap:10px;}
  #menu .box h3{font-weight:400;font-size:13px;letter-spacing:.3em;color:var(--amber);
    margin:0 0 14px;font-family:"Microsoft YaHei",sans-serif;text-align:center;}
  #menu .btn{width:100%;padding:12px;}

  #director{position:fixed;inset:0;z-index:90;display:none;background:rgba(3,5,5,.95);
    padding:40px;overflow:auto;font-family:Consolas,Monaco,monospace;font-size:12px;
    line-height:1.7;color:#9fd0c8;}
  #director.on{display:block;}
  #director h4{color:var(--amber);font-weight:400;letter-spacing:.2em;margin:0 0 12px;}
  #director .jump{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 24px;}
  #director .jump button{font-family:inherit;font-size:11px;padding:4px 8px;background:none;
    color:#9fd0c8;border:1px solid rgba(159,208,200,.3);cursor:pointer;}
  #director .jump button:hover{background:#9fd0c8;color:#08110f;}
  #director pre{white-space:pre-wrap;color:#c9c3b6;}
  #director .close{position:fixed;top:26px;right:36px;color:#9fd0c8;cursor:pointer;
    border:1px solid rgba(159,208,200,.35);padding:6px 14px;font-family:inherit;}
  .hide{display:none!important;}
  @media (max-width:720px){
    #hud{padding:16px 18px;font-size:10px;}
    #subwrap{padding:0 6vw 7.5vh;}
    #hint{right:6vw;bottom:2.6vh;}
    #choices{padding:9vh 6vw;}
    .card{padding:5vh 8vw;}
  }
</style>
</head>
<body>

<div id="stage">
  <img id="shot" alt="">
  <div id="shade"></div>
  <div id="grain"></div>
</div>

<div id="hud">
  <div class="left" id="chapterLabel">第一章 · 零号大坝</div>
  <div class="right">
    <button id="btnMenu">菜单</button>
  </div>
</div>

<div id="subwrap"><div id="subtitle">
  <div id="name"></div>
  <div id="text"></div>
</div></div>
<div id="hint">点击继续 · 空格</div>

<div id="choices">
  <div id="prompt"></div>
  <div id="opts"></div>
</div>

<div class="card" id="death">
  <div class="tag">死 亡 结 局</div>
  <h2 class="title" id="deathTitle"></h2>
  <div class="rule"></div>
  <div class="sum" id="deathSum"></div>
  <div class="note" id="deathNote"></div>
  <div class="btns">
    <button class="btn primary" id="btnBack">回溯到选择</button>
    <button class="btn" id="btnRestart1">从头开始</button>
  </div>
</div>

<div class="card" id="endlay">
  <div class="tag">第 一 章 完</div>
  <h2 class="title" id="endTitle">被留下的人</h2>
  <div class="sub" id="endSub">零号大坝</div>
  <div class="body" id="endBody"></div>
  <div class="stats" id="endStats"></div>
  <div class="btns">
    <button class="btn primary" id="btnReplay">重玩本章</button>
    <button class="btn" id="btnToTitle">回到标题</button>
  </div>
</div>

<div id="title">
  <div class="small">互 动 叙 事 · 试 玩 原 型</div>
  <h1>被留下的人</h1>
  <div class="line"></div>
  <div class="cap">第一章 · 零号大坝</div>
  <div class="btns">
    <button class="btn primary" id="btnStart">开 始</button>
    <button class="btn" id="btnContinue">继续上次</button>
    <button class="btn" id="btnHow">怎 么 玩</button>
  </div>
  <div class="foot">v0.1 · 仅第一章 · 素材为关键帧占位，非最终视频</div>
</div>

<div id="menu">
  <div class="box">
    <h3>菜 单</h3>
    <button class="btn" id="mResume">继续</button>
    <button class="btn" id="mRestart">重玩本章</button>
    <button class="btn" id="mDirector">导演模式</button>
    <button class="btn" id="mTitle">回到标题</button>
    <button class="btn" id="mMute">声音：开</button>
  </div>
</div>

<div id="director">
  <div class="close" id="dClose">关闭 (D)</div>
  <h4>导演模式 · 节点与状态</h4>
  <pre id="dState"></pre>
  <h4>跳转节点</h4>
  <div class="jump" id="dJump"></div>
</div>

<script>
/* ============================================================
   数据区：第一章 全量节点
   lines: [说话人, 文本]，说话人为空 = 旁白
   ============================================================ */
const CH1 = {
  start: "p0",
  nodes: {
    p0: { t:"scene", ch:"序", img:"assets/hero.jpg", next:"s1a", lines:[
      ["","这是我第一次随正式行动队执行任务。红狼带队，蜂医负责医疗。"],
      ["","我们要前往零号大坝外围的维修区，接回失联十七小时的情报联络员灰鹭，并取回他携带的资料。"],
      ["","抵达时，附近已有阿萨拉卫队搜查。我们避开巡逻，从后门接近了灰鹭最后出现的维修间。"]
    ]},

    s1a: { t:"scene", ch:"1-1 门后的枪", img:"assets/corridor.jpg", next:"s1b", lines:[
      ["","两名阿萨拉卫队士兵刚从前院离开，鞋底踩过碎玻璃的声音还没消失。红狼让我们沿外墙靠近后面的维修间。"],
      ["红狼","灰鹭。接应。"],
      ["","门后没有回应。"],
      ["红狼","有医疗人员。"],
      ["","里面响起拖动声。一只身份终端从门缝伸出来，边缘沾着血。核验通过。"],
      ["","门打开时，我先看见一支手枪。"]
    ]},

    s1b: { t:"scene", ch:"1-1 门后的枪", img:"assets/huilu.jpg", next:"s1c", lines:[
      ["","灰鹭靠着工作台，枪口朝下，左腿的布料湿了一大片。他的视线从我们的臂章移到院外，最后停在红狼脸上。"],
      ["灰鹭","接我的车呢？"],
      ["红狼","在外围。你能走吗？"],
      ["灰鹭","哪一辆？"],
      ["蜂医","先让我看腿。"],
      ["","灰鹭没有拒绝处理伤口，握枪的手却没松。"],
      ["红狼","枪放下。"],
      ["","灰鹭照做，手仍按在枪旁。"],
      ["灰鹭","你们的任务怎么说的？接我，还是取资料？"],
      ["红狼","两样。"],
      ["灰鹭","新来的？"],
      ["","他看了我一眼。"],
      ["灰鹭","那你记住他说了什么。"],
      ["红狼","蜂医处理伤口。新人，把情况问清楚。我看前面。"]
    ]},

    s1c: { t:"scene", ch:"1-1 门后的枪", img:"assets/huilu.jpg", next:"c1", lines:[
      ["","我站到工作台边。灰鹭的包就在他脚下，拉链开着，里面露出密封资料匣的一角。"],
      ["我","资料在这里？"],
      ["灰鹭","在。封条没动。"],
      ["我","你为什么没按安排交接？"],
      ["灰鹭","换了你，车提前来了，人能报出代号，证件也对，你上不上？"],
      ["我","看情况。"],
      ["灰鹭","我当时就看了一眼。"],
      ["","蜂医揭开临时包扎，他疼得抓紧了桌沿。"],
      ["","我等他缓过来。他却不再往下说，反而把资料匣往我这边推了一点。"],
      ["灰鹭","先拿好这个。"]
    ]},

    c1: { t:"choice", ch:"1-1 门后的枪", img:"assets/huilu.jpg", prompt:"选择一 · 先问清什么", lines:[
      ["","门外随时会有人回来。我只来得及问一个问题。"]
    ], options:[
      { k:"A", text:"把接应车辆和人员特征告诉我。我先让指挥台核对，省得再次接错。", next:"c1a", stats:{gti:1} },
      { k:"B", text:"先不核车。你离开接应点以后怎么到这里的？还有没有别的出口？", next:"c1b", flags:{tunnel:true}, stats:{gti:1} },
      { k:"C", text:"我先确认资料有没有缺失。车的事，等你缓过来再说。", next:"c1c", flags:{tunnel:true,westExit:true}, stats:{asala:1} }
    ]},

    c1a: { t:"death", ch:"1-1 门后的枪", img:"assets/ruins.jpg", title:"核对之后",
      note:"回溯：选择一", summary:"你想先取得可靠的确认。等待核验的时间让搜索队截断了退路，灰鹭指出出口时已经来不及。你死在转移途中。",
      lines:[
      ["","灰鹭看着我打开通讯。"],
      ["灰鹭","现在就问？"],
      ["我","核对一下，后面才能安排。"],
      ["","我没有直接呼叫公开频道，只通过小队链路提交了核验请求。几分钟后，指挥台回复：原接应身份有效，灰鹭可能因失血和遭袭产生误判。"],
      ["灰鹭","他们核的是证件。我说的是那辆车里有人朝我开枪。"],
      ["","通讯另一端仍在要求补齐交接信息。红狼打断问询。"],
      ["红狼","先撤。"],
      ["","灰鹭指向后门。前院又传来脚步——核验耽搁的这几分钟里，搜索队已经绕过外墙。我们退回原来的巷子，两端很快响起枪声。我在寻找掩体时被击中胸口，死在两栋建筑之间。"]
    ]},

    c1b: { t:"scene", ch:"1-1 门后的枪", img:"assets/huilu.jpg", next:"m1", lines:[
      ["灰鹭","后面的泵房。底下有检修道。"],
      ["我","你从那边进来的？"],
      ["灰鹭","是。有个岔口，右边已经塌了，左边能通旧检修场。地图上不一定标着。"],
      ["我","你记得接应的车吗？"],
      ["灰鹭","白色医疗车，右侧后窗贴着灰胶带。我逃走时，它沿路找过我。"],
      ["我","你确定是同一辆？"],
      ["灰鹭","窗角缺了一块，胶带没贴平。我就是从那扇窗看见里面的人拿枪。"],
      ["","他盯着我的终端。"],
      ["灰鹭","等离开这里，你再决定要不要信。"]
    ]},

    c1c: { t:"scene", ch:"1-1 门后的枪", img:"assets/huilu.jpg", next:"m1", lines:[
      ["","我按任务清单核对资料匣，封条完好，数量一致。"],
      ["灰鹭","你们拿到东西了。"],
      ["我","现在带你走。"],
      ["灰鹭","原路出去？"],
      ["我","有别的路？"],
      ["灰鹭","下面有检修道，左边通旧检修场。右边塌了。去的时候别挑最近的洞口出来。"],
      ["灰鹭","我昨晚试过装卸院。北门有人，没过去。"],
      ["我","西边呢？"],
      ["灰鹭","有个出料口，被旧铁皮遮着。里面能推开。我伤成这样翻不过去，你们也许可以。"],
      ["","我记下位置。他又叫住我。"],
      ["灰鹭","接应如果还是右后窗贴灰胶带的白色医疗车，别让我上去。昨天就是它。"]
    ]},

  if (S.muted) return;
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || "sine"; o.frequency.value = freq;
    g.gain.value = gain;
    o.connect(g); g.connect(AC.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
    o.stop(AC.currentTime + dur + 0.02);
  }catch(e){}
}

function snapshot(){
  return JSON.parse(JSON.stringify({ node:S.node, flags:S.flags, stats:S.stats,
    deaths:S.deaths, log:S.log, started:S.started }));
}
function save(){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(Object.assign(snapshot(),{line:S.line, checkpoint:S.checkpoint}))); }
  catch(e){}
}
function clearSave(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }

function setImage(src){
  if (S.currentImg === src) return;
  S.currentImg = src;
  elShot.style.opacity = "0";
  setTimeout(()=>{
    elShot.src = src;
    elShot.style.opacity = "1";
    elShot.classList.remove("kb");
    void elShot.offsetWidth;
    elShot.classList.add("kb");
  }, 220);
}

function enter(id, line){
  const n = CH1.nodes[id];
  if (!n) { console.error("missing node", id); return; }
  if (n.t === "choice") S.checkpoint = snapshot();
  S.node = id; S.line = line || 0; S.done = false;
  elMenu.classList.remove("on");
  elDeath.classList.remove("on");
  elEnd.classList.remove("on");
  elChoices.classList.remove("on");
  elChapter.textContent = "第一章 · 零号大坝" + (n.ch ? "　/　" + n.ch : "");
  setImage(n.img);
  elSub.classList.remove("on");
  setTimeout(()=>{ showLine(); }, 80);
  save();
}

function showLine(){
  const n = CH1.nodes[S.node];
  const line = n.lines && n.lines[S.line];
  if (!line){ endOfNode(); return; }
  const speaker = line[0], text = line[1];
  elName.textContent = speaker || "旁 白";
  elName.classList.toggle("narr", !speaker);
  elSub.classList.add("on");
  elHint.classList.remove("on");
  typeText(elText, text);
}

function typeText(el, text){
  clearTimeout(S.timer);
  el.textContent = "";
  S.typing = true;
  let i = 0;
  const step = ()=>{
    if (!S.typing) return;
    el.textContent += text.charAt(i);
    i++;
    if (i >= text.length){ S.typing = false; elHint.classList.add("on"); return; }
    const c = text.charAt(i-1);
    const d = "，。！？；：、".indexOf(c) >= 0 ? 110 : 22;
    S.timer = setTimeout(step, d);
  };
  step();
}

function finishTyping(){
  const n = CH1.nodes[S.node];
  const line = n.lines[S.line];
  clearTimeout(S.timer);
  S.typing = false;
  elText.textContent = line[1];
  elHint.classList.add("on");
}

function endOfNode(){
  if (S.done) return;
  S.done = true;
  const n = CH1.nodes[S.node];
  if (n.t === "death"){ showDeath(n); return; }
  if (n.t === "end"){ showEnd(n); return; }
  if (n.options){ showChoices(n); return; }
  if (n.next){ enter(n.next); return; }
}

function advance(){
  if (elTitle.style.display !== "none" && !elTitle.classList.contains("hide")) return;
  if (elDeath.classList.contains("on") || elEnd.classList.contains("on")) return;
  if (elChoices.classList.contains("on")) return;
  if (elMenu.classList.contains("on")) return;
  if (elDir.classList.contains("on")) return;
  const n = CH1.nodes[S.node];
  if (!n) return;
  if (S.typing){ finishTyping(); return; }
  if (S.line < n.lines.length - 1){ S.line++; showLine(); save(); tone(1500,.03,.012,"triangle"); return; }
  endOfNode();
}

function showChoices(n){
  elSub.classList.remove("on");
  elHint.classList.remove("on");
  elPrompt.textContent = n.prompt;
  elOpts.innerHTML = "";
  n.options.forEach((opt)=>{
    const b = document.createElement("button");
    b.className = "opt";
    b.innerHTML = '<span class="k">' + opt.k + '</span><span>' + opt.text + '</span>';
    b.addEventListener("click", (e)=>{ e.stopPropagation(); pick(opt); });
    elOpts.appendChild(b);
  });
  elChoices.classList.add("on");
}

function pick(opt){
  elChoices.classList.remove("on");
  tone(900,.05,.02,"triangle");
  if (opt.flags) Object.assign(S.flags, opt.flags);
  if (opt.stats) for (const k in opt.stats) S.stats[k] = (S.stats[k]||0) + opt.stats[k];
  S.log.push({ ch: CH1.nodes[S.node].ch, prompt: CH1.nodes[S.node].prompt, pick: opt.k + ". " + opt.text });
  let next = opt.next;
  if (opt.route){ next = S.flags[opt.route.flag] ? opt.route.yes : opt.route.no; }
  enter(next);
}

function showDeath(n){
  S.deaths++;
  tone(60,.9,.09,"sine");
  setTimeout(()=>tone(48,.7,.06,"sine"), 120);
  $("deathTitle").textContent = n.title;
  $("deathSum").textContent = n.summary || "";
  $("deathNote").textContent = n.note || "";
  elSub.classList.remove("on");
  elHint.classList.remove("on");
  elDeath.classList.add("on");
  save();
}

function showEnd(n){
  $("endlay").querySelector(".title").textContent = n.title;
  $("endSub").textContent = n.sub;
  $("endBody").innerHTML = n.body.map(x=>"<div>"+x+"</div>").join("");
  const mins = Math.max(1, Math.round((Date.now() - (S.started||Date.now()))/60000));
  $("endStats").innerHTML =
    "用时 <b>" + mins + " 分钟</b>　·　经历死亡 <b>" + S.deaths + " 次</b><br>" +
    "倾向　GTI <b>" + S.stats.gti + "</b>　哈夫克 <b>" + S.stats.haafk + "</b>　阿萨拉 <b>" + S.stats.asala + "</b>";
  elSub.classList.remove("on");
  elHint.classList.remove("on");
  elEnd.classList.add("on");
  clearSave();
}

function rollback(){
  elDeath.classList.remove("on");
  if (!S.checkpoint){ startNew(); return; }
  const cp = JSON.parse(JSON.stringify(S.checkpoint));
  S.flags = cp.flags; S.stats = cp.stats; S.log = cp.log;
  enter(cp.node);
}

function startNew(){
  clearSave();
  S.flags = {}; S.stats = {gti:0,haafk:0,asala:0}; S.deaths = 0; S.log = [];
  S.checkpoint = null; S.started = Date.now();
  elTitle.classList.add("hide");
  elEnd.classList.remove("on");
  enter(CH1.start);
}

function resume(){
  let d = null;
  try{ d = JSON.parse(localStorage.getItem(SAVE_KEY) || "null"); }catch(e){}
  if (!d){ startNew(); return; }
  S.flags = d.flags || {}; S.stats = d.stats || {gti:0,haafk:0,asala:0};
  S.deaths = d.deaths || 0; S.log = d.log || []; S.started = d.started || Date.now();
  S.checkpoint = d.checkpoint || null;
  elTitle.classList.add("hide");
  enter(d.node, d.line || 0);
}

function toTitle(){
  elDeath.classList.remove("on"); elEnd.classList.remove("on");
  elChoices.classList.remove("on"); elMenu.classList.remove("on"); elDir.classList.remove("on");
  elSub.classList.remove("on"); elHint.classList.remove("on");
  elTitle.classList.remove("hide");
  let has = false;
  try{ has = !!localStorage.getItem(SAVE_KEY); }catch(e){}
  $("btnContinue").style.display = has ? "block" : "none";
}

/* ---------- 导演模式 ---------- */
function toggleDirector(){
  const on = elDir.classList.toggle("on");
  if (on){
    elDir.querySelector("#dState").textContent = JSON.stringify({
      node:S.node, line:S.line, flags:S.flags, stats:S.stats, deaths:S.deaths,
      checkpoint:S.checkpoint ? S.checkpoint.node : null
    }, null, 2);
    const jump = elDir.querySelector("#dJump");
    jump.innerHTML = "";
    Object.keys(CH1.nodes).forEach(id=>{
      const b = document.createElement("button");
      b.textContent = id + (CH1.nodes[id].t==="choice" ? " ★" : "");
      b.onclick = ()=>{ elDir.classList.remove("on"); enter(id); };
      jump.appendChild(b);
    });
  }
}

/* ---------- 事件 ---------- */
document.addEventListener("click", (e)=>{
  if (e.target.closest("button")) return;
  if (e.target.closest("#menu") || e.target.closest("#director")) return;
  advance();
});
document.addEventListener("keydown", (e)=>{
  if (e.code === "Space" || e.code === "Enter"){ e.preventDefault(); advance(); }
  else if (e.key === "Escape"){ elMenu.classList.toggle("on"); }
  else if (e.key === "d" || e.key === "D"){ toggleDirector(); }
  else if (["1","2","3"].includes(e.key)){
    const opts = elOpts.querySelectorAll(".opt");
    const i = parseInt(e.key,10) - 1;
    if (elChoices.classList.contains("on") && opts[i]) opts[i].click();
  }
});
$("btnStart").onclick = ()=>{ elTitle.classList.add("hide"); startNew(); };
$("btnContinue").onclick = ()=>{ elTitle.classList.add("hide"); resume(); };
$("btnHow").onclick = ()=>{
  alert("玩法：\n\n· 点击画面 / 空格：继续\n· 数字键 1-3 或点击选项：做出选择\n· 选错会进入死亡结局，可以点击「回溯到选择」重来\n· ESC：菜单　D：导演模式\n\n本版为第一章原型，画面为关键帧占位。");
};
$("btnBack").onclick = rollback;
$("btnRestart1").onclick = startNew;
$("btnReplay").onclick = startNew;
$("btnToTitle").onclick = toTitle;
$("btnMenu").onclick = ()=> elMenu.classList.toggle("on");
$("mResume").onclick = ()=> elMenu.classList.remove("on");
$("mRestart").onclick = ()=>{ elMenu.classList.remove("on"); startNew(); };
$("mDirector").onclick = ()=>{ elMenu.classList.remove("on"); toggleDirector(); };
$("mTitle").onclick = toTitle;
$("mMute").onclick = (e)=>{
  S.muted = !S.muted;
  e.target.textContent = "声音：" + (S.muted ? "关" : "开");
  elMenu.classList.remove("on");
};
$("dClose").onclick = ()=> elDir.classList.remove("on");

/* 初始化 */
(function init(){
  const has = (()=>{ try{ return !!localStorage.getItem(SAVE_KEY); }catch(e){ return false; } })();
  $("btnContinue").style.display = has ? "block" : "none";
  elShot.src = "assets/dam.jpg";
  if (location.hash === "#play"){ elTitle.classList.add("hide"); startNew(); }
})();
</script>
</body>
</html>
